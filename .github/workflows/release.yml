name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Apple Silicon .app bundle, ad-hoc signed (no Developer ID): first launch
  # of a downloaded copy needs right-click > Open or
  # `xattr -d com.apple.quarantine starview.app`.
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Build
        run: cargo build --release

      - name: Bundle starview.app
        run: |
          scripts/make-app.sh
          # ditto preserves bundle structure + permissions in the zip.
          ditto -c -k --keepParent target/release/starview.app starview-macos.zip
          shasum -a 256 starview-macos.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            starview-macos.zip
            SHA256SUMS-macos.txt

  release:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history + all tags to build release notes.
          fetch-depth: 0

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String '^version = "(.+)"' Cargo.toml).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag v$tag does not match Cargo.toml version $ver" }

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer\starview.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Fetch macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item target\release\starview.exe starview.exe
          Get-FileHash starview.exe, installer\Output\starview-setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS-macos.txt | Add-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Release notes for this version
        # Just this tag's section of the changelog, used as the release body.
        run: git-cliff --config cliff.toml --current --strip header --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            installer/Output/starview-setup.exe
            starview.exe
            starview-macos.zip
            SHA256SUMS.txt

  # Regenerate CHANGELOG.md from the full history and commit it back to main, so
  # the file always lists the commits that landed in each release. Runs after a
  # tag is pushed; pushing to main here does not re-trigger this workflow (it is
  # gated on tags only).
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Regenerate CHANGELOG.md
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
          else
            git add CHANGELOG.md
            git commit -m "Update changelog for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi
