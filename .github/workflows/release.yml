name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String '^version = "(.+)"' Cargo.toml).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag v$tag does not match Cargo.toml version $ver" }

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer\starview.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item target\release\starview.exe starview.exe
          Get-FileHash starview.exe, installer\Output\starview-setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/starview-setup.exe
            starview.exe
            SHA256SUMS.txt
          generate_release_notes: true
